<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06598f">
<title>Quản lý lời chúc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔐</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/ocean.css">
<style>
  body { overflow-y: auto; min-height: 100dvh; background-attachment: fixed; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px calc(40px + env(safe-area-inset-bottom)); }
  .glass {
    background: linear-gradient(160deg, rgba(255,255,255,.18), rgba(255,255,255,.07));
    border: 1px solid rgba(255,255,255,.3); border-radius: 22px;
    box-shadow: 0 16px 40px rgba(0, 20, 50, .35);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  h1 { font-size: 24px; margin: 0; }
  .muted { opacity: .75; font-size: 14px; }
  input {
    width: 100%; font: 16px var(--font-body); color: #fff; padding: 13px 15px; border-radius: 14px; outline: none;
    background: rgba(2, 30, 60, .4); border: 1.5px solid rgba(255,255,255,.3);
  }
  input::placeholder { color: rgba(232,251,255,.5); }
  input:focus { border-color: var(--aqua); }
  .btn {
    font: 600 15px var(--font-body); border: 0; border-radius: 99px; padding: 11px 18px; cursor: pointer;
    color: #023154; background: linear-gradient(180deg, #e8fbff, #8fe2fa); white-space: nowrap;
  }
  .btn.ghost { color: #fff; background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.3); }
  .btn.danger { color: #fff; background: #d9485f; }
  .btn.danger.armed { background: #ff2d4f; box-shadow: 0 0 0 3px rgba(255,80,100,.35); }
  .btn:disabled { opacity: .5; cursor: default; }
  .error { color: #ffd2cc; background: rgba(160,30,40,.45); padding: 10px 14px; border-radius: 12px; font-size: 14px; margin-top: 12px; display: none; }
  .error.show { display: block; }

  #login { max-width: 400px; margin: 12vh auto 0; padding: 28px 22px; text-align: center; }
  #login h1 { margin-bottom: 6px; }
  #login form { margin-top: 20px; display: grid; gap: 12px; }

  #panel { display: none; }
  .top { padding: 18px 20px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center; justify-content: space-between; }
  .stat b { font-size: 30px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .bar { margin: 14px 0; display: flex; gap: 10px; }
  .list { display: grid; gap: 10px; }
  .item { padding: 14px 16px; display: flex; gap: 12px; align-items: flex-start; }
  .item .body { flex: 1; min-width: 0; }
  .item .name { font-weight: 700; color: var(--aqua); }
  .item .meta { font-size: 12px; opacity: .6; margin-left: 6px; font-weight: 400; color: #fff; }
  .item .text { margin-top: 4px; line-height: 1.5; white-space: pre-line; overflow-wrap: anywhere; }
  .item.gone { opacity: 0; transform: translateX(30px); transition: all .3s; }
  .empty { text-align: center; padding: 40px 10px; opacity: .7; }
  .clear-box { display: none; padding: 16px; margin-top: 12px; }
  .clear-box.show { display: block; }
  .clear-box .row { display: flex; gap: 8px; margin-top: 10px; }
  .live { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #4ade80; margin-right: 6px; box-shadow: 0 0 8px #4ade80; }
  .live.off { background: #f87171; box-shadow: 0 0 8px #f87171; }
</style>
</head>
<body>
<div class="wrap">

  <section id="login" class="glass">
    <div style="font-size:40px">🔐</div>
    <h1>Quản lý lời chúc</h1>
    <div class="muted">Nhập mật khẩu quản trị để tiếp tục</div>
    <form id="loginForm" autocomplete="off">
      <input id="pw" type="password" placeholder="Mật khẩu" autocomplete="current-password" required>
      <button class="btn" type="submit">Đăng nhập</button>
    </form>
    <div class="error" id="loginErr"></div>
  </section>

  <section id="panel">
    <div class="glass top">
      <div>
        <h1>Quản lý lời chúc</h1>
        <div class="muted"><span class="live" id="live"></span><span class="stat"><b id="count">0</b> / <span id="max">200</span> lời chúc</span></div>
      </div>
      <div class="tools">
        <button class="btn danger" id="clearBtn">Xoá tất cả</button>
        <button class="btn ghost" id="logout">Đăng xuất</button>
      </div>
    </div>

    <div class="glass clear-box" id="clearBox">
      <b>Xoá toàn bộ lời chúc?</b>
      <div class="muted">Không thể hoàn tác. Gõ <b>XOA</b> để xác nhận.</div>
      <div class="row">
        <input id="clearInput" placeholder="XOA" autocapitalize="characters">
        <button class="btn danger" id="clearConfirm">Xoá</button>
        <button class="btn ghost" id="clearCancel">Huỷ</button>
      </div>
    </div>

    <div class="bar">
      <input id="search" placeholder="🔍 Tìm theo tên hoặc nội dung…">
    </div>
    <div class="error" id="panelErr"></div>
    <div class="list" id="list"></div>
  </section>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let key = "";
  try { key = sessionStorage.getItem("adminKey") || ""; } catch {}
  let wishes = [];
  let timer = null;

  async function api(path, body) {
    const opt = { headers: { "X-Admin-Key": key }, cache: "no-store" };
    if (body !== undefined) {
      opt.method = "POST";
      opt.headers["Content-Type"] = "application/json";
      opt.body = JSON.stringify(body);
    }
    const res = await fetch(path, opt);
    let data = {};
    try { data = await res.json(); } catch {}
    return { ok: res.ok, status: res.status, data };
  }

  // ---------- Đăng nhập ----------
  async function tryLogin() {
    const r = await api("/api/admin/wishes");
    if (r.ok) {
      try { sessionStorage.setItem("adminKey", key); } catch {}
      $("login").style.display = "none";
      $("panel").style.display = "block";
      apply(r.data);
      clearInterval(timer);
      timer = setInterval(refresh, 3000);
      return true;
    }
    $("loginErr").textContent = r.data.error || "Không đăng nhập được.";
    $("loginErr").classList.add("show");
    return false;
  }

  $("loginForm").addEventListener("submit", (e) => {
    e.preventDefault();
    $("loginErr").classList.remove("show");
    key = $("pw").value;
    tryLogin().catch(() => {
      $("loginErr").textContent = "Không kết nối được máy chủ.";
      $("loginErr").classList.add("show");
    });
  });

  $("logout").addEventListener("click", () => {
    try { sessionStorage.removeItem("adminKey"); } catch {}
    key = ""; clearInterval(timer);
    $("panel").style.display = "none";
    $("login").style.display = "block";
    $("pw").value = "";
  });

  // ---------- Danh sách ----------
  async function refresh() {
    try {
      const r = await api("/api/admin/wishes");
      $("live").classList.toggle("off", !r.ok);
      if (r.status === 401) return $("logout").click();
      if (r.ok) apply(r.data);
    } catch { $("live").classList.add("off"); }
  }

  function apply(data) {
    $("count").textContent = data.count;
    $("max").textContent = data.max;
    const sig = data.wishes.map((w) => w.id).join(",");
    if (sig === apply.sig) return;           // không đổi thì không vẽ lại
    if (document.querySelector(".armed")) return; // đang chờ xác nhận xoá thì đợi lần sau
    apply.sig = sig;
    wishes = data.wishes.slice().reverse();  // mới nhất lên đầu
    render();
  }

  const fmt = (t) => {
    const d = new Date(t);
    return isNaN(d) ? "" : d.toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" }) + " · " +
      d.toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit" });
  };

  function render() {
    const q = $("search").value.trim().toLowerCase();
    const items = q ? wishes.filter((w) => (w.name + " " + w.text).toLowerCase().includes(q)) : wishes;
    const list = $("list");
    list.textContent = "";
    if (!items.length) {
      const e = document.createElement("div");
      e.className = "glass empty";
      e.textContent = q ? "Không tìm thấy lời chúc nào." : "Chưa có lời chúc nào.";
      list.appendChild(e);
      return;
    }
    for (const w of items) {
      const row = document.createElement("div");
      row.className = "glass item";
      const body = document.createElement("div");
      body.className = "body";
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = w.name;
      const meta = document.createElement("span");
      meta.className = "meta";
      meta.textContent = "#" + w.id + " · " + fmt(w.at);
      name.appendChild(meta);
      const text = document.createElement("div");
      text.className = "text";
      text.textContent = w.text;
      body.append(name, text);

      const del = document.createElement("button");
      del.className = "btn danger";
      del.textContent = "Xoá";
      let armTimer;
      del.addEventListener("click", async () => {
        if (!del.classList.contains("armed")) {
          del.classList.add("armed");
          del.textContent = "Chắc chắn?";
          armTimer = setTimeout(() => { del.classList.remove("armed"); del.textContent = "Xoá"; }, 3000);
          return;
        }
        clearTimeout(armTimer);
        del.disabled = true;
        const r = await api("/api/admin/delete", { id: w.id }).catch(() => ({ ok: false, data: {} }));
        if (r.ok || r.status === 404) {
          row.classList.add("gone");
          wishes = wishes.filter((x) => x.id !== w.id);
          $("count").textContent = r.data.count ?? wishes.length;
          apply.sig = wishes.slice().reverse().map((x) => x.id).join(",");
          setTimeout(render, 300);
        } else {
          del.disabled = false;
          showErr(r.data.error || "Xoá không thành công.");
        }
      });
      row.append(body, del);
      list.appendChild(row);
    }
  }

  function showErr(msg) {
    $("panelErr").textContent = msg;
    $("panelErr").classList.add("show");
    setTimeout(() => $("panelErr").classList.remove("show"), 4000);
  }

  $("search").addEventListener("input", render);

  // ---------- Xoá tất cả ----------
  $("clearBtn").addEventListener("click", () => { $("clearBox").classList.add("show"); $("clearInput").focus(); });
  $("clearCancel").addEventListener("click", () => { $("clearBox").classList.remove("show"); $("clearInput").value = ""; });
  $("clearConfirm").addEventListener("click", async () => {
    if ($("clearInput").value.trim().toUpperCase() !== "XOA") return showErr("Gõ đúng chữ XOA để xác nhận.");
    const r = await api("/api/admin/clear", { confirm: "XOA" }).catch(() => ({ ok: false, data: {} }));
    if (!r.ok) return showErr(r.data.error || "Xoá không thành công.");
    $("clearBox").classList.remove("show");
    $("clearInput").value = "";
    refresh();
  });

  if (key) tryLogin().catch(() => {});
})();
</script>
</body>
</html>
